<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1B2D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cardiac Scores"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>Cardiac Scores</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>/* Layout: clinical instrument — patient profile column on the left (one entry feeds every score),
   score cards on the right grouped by clinical scenario; phones switch between the two with a view bar.
   Palette: Prof. Baghdady's navy / gold / cyan system. System fonts only, so the app works fully offline. */
:root{
  --navy:#1E3A5F; --navy-2:#0F1B2D; --gold:#C8962E; --cyan:#1A9BB5;
  --bg:#EDF1F5; --panel:#FFFFFF; --ink:#15233A; --muted:#58697E; --line:#D3DCE6; --field:#F6F8FB;
  --chip:#E4EBF3; --chip-on:#1E3A5F; --chip-on-ink:#FFFFFF; --focus:#1A9BB5;
  --c0:#2E8B57; --c1:#B8860B; --c2:#D9682B; --c3:#C0392B; --cx:#1A9BB5;
  --c0-bg:#E6F3EC; --c1-bg:#FBF3DE; --c2-bg:#FCEDE3; --c3-bg:#FBE7E5; --cx-bg:#E3F3F7;
  --warn:#9A5B00; --warn-bg:#FFF5E0; --act-bg:#EEF3F9;
  --f-ui:Calibri, Carlito, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-num:"Segoe UI", Calibri, system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1522; --panel:#132235; --ink:#E3EAF3; --muted:#93A4B8; --line:#25394F; --field:#0F1C2C;
  --chip:#1C2F45; --chip-on:#C8962E; --chip-on-ink:#0F1B2D;
  --c0:#4FBF84; --c1:#E0B13A; --c2:#F08A50; --c3:#F06A5C; --cx:#3FC0D8;
  --c0-bg:#123326; --c1-bg:#3A3112; --c2-bg:#3C2416; --c3-bg:#3D1B19; --cx-bg:#10323B;
  --warn:#F2C06B; --warn-bg:#352812; --act-bg:#182B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1522; --panel:#132235; --ink:#E3EAF3; --muted:#93A4B8; --line:#25394F; --field:#0F1C2C;
  --chip:#1C2F45; --chip-on:#C8962E; --chip-on-ink:#0F1B2D;
  --c0:#4FBF84; --c1:#E0B13A; --c2:#F08A50; --c3:#F06A5C; --cx:#3FC0D8;
  --c0-bg:#123326; --c1-bg:#3A3112; --c2-bg:#3C2416; --c3-bg:#3D1B19; --cx-bg:#10323B;
  --warn:#F2C06B; --warn-bg:#352812; --act-bg:#182B42; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy-2)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy-2);color:#fff;border-bottom:3px solid var(--gold)}
.top .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:18px;letter-spacing:.2px}
.brand span{font-size:12px;color:#B5C3D4}
.search{flex:1 1 220px;max-width:380px;display:flex;align-items:center;background:#1B2D45;border:1px solid #34506F;border-radius:7px}
.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:7px 10px;font-size:14.5px}
.search input::placeholder{color:#9AAEC5}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.tb button{font-size:13px;background:transparent;color:#fff;border:1px solid #3E5776;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.tb button:hover{border-color:var(--gold)}
.tb button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy-2);font-weight:700}

/* view switch (phones) */
.views{display:none;background:var(--navy)}
.views .in{display:flex;max-width:1500px;margin:0 auto}
.views button{flex:1;background:none;border:0;color:#C6D3E2;padding:10px 6px 8px;border-bottom:3px solid transparent;cursor:pointer;font-size:14px}
.views button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--cyan);font-weight:700}

.wrap{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:18px;padding-block:16px 48px;max-width:1500px;margin:0 auto}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .views{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .top{position:static}
  body[data-view="patient"] #scorecol,body[data-view="patient"] #summary{display:none}
  body[data-view="scores"] #profile,body[data-view="summary"] #profile{display:none}
  .colhead .vt{display:none}
}
body[data-view="summary"] #scorecol{display:none}
body:not([data-view="summary"]) #summary{display:none}

/* profile */
#profile{display:flex;flex-direction:column;gap:10px;min-width:0;align-self:start}
@media (min-width:901px){#profile{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}}
.example{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px dashed var(--gold);background:var(--panel);border-radius:8px;padding:8px 11px;font-size:13px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.grp .cnt{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:400}
.grp .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>label,.f>.lb{font-size:12px;color:var(--muted)}
.f .box{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:6px}
.f select{flex:1;min-width:0;background:transparent;border:0;padding:7px 8px;font-size:14.5px;width:100%}
.f.wide{grid-column:1/-1}
.f input{background:transparent;border:0;padding:7px 8px;width:100%;min-width:0;font-size:15px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.f .u{font-size:11.5px;color:var(--muted);padding-right:8px;white-space:nowrap}
.f.need .box{border-color:var(--c2);box-shadow:0 0 0 2px var(--c2-bg)}
.f.need>label{color:var(--c2);font-weight:700}
.f.out .box{border-color:var(--c1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;background:var(--chip);border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip.auto{border-style:dashed;border-color:var(--muted)}
.chip .tag{font-size:11px;opacity:.75;margin-left:5px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--field)}
.seg button{flex:1 0 auto;background:transparent;border:0;padding:6px 10px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.derived{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.pill{background:var(--chip);border-radius:20px;padding:2px 9px;font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* score column */
#scorecol,#summary{min-width:0;display:flex;flex-direction:column;gap:14px}
.colhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.scen{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0}
.scen button{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.scen button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.vt{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.vt button{background:none;border:0;padding:6px 12px;cursor:pointer;font-size:13.5px}
.vt button[aria-pressed="true"]{background:var(--navy);color:#fff}
.dom-h{margin:6px 0 -4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center}

.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;border-top:4px solid var(--line)}
.sc[data-cat="0"]{border-top-color:var(--c0)}.sc[data-cat="1"]{border-top-color:var(--c1)}.sc[data-cat="2"]{border-top-color:var(--c2)}.sc[data-cat="3"]{border-top-color:var(--c3)}.sc[data-cat="x"]{border-top-color:var(--cx)}
.sc header{display:flex;align-items:flex-start;gap:8px;padding:11px 13px 0}
.sc h3{margin:0;font-size:16px;line-height:1.2}
.sc .dm{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sc .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fav{background:none;border:0;cursor:pointer;padding:2px 4px;color:var(--muted);line-height:1}
.fav svg{width:19px;height:19px;display:block}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav[aria-pressed="true"] path{fill:currentColor}
.sc .blurb{margin:3px 13px 0;font-size:12.5px;color:var(--muted)}
.res{padding:9px 13px 0;display:flex;flex-direction:column;gap:5px}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.big .v{font-size:30px;font-weight:700;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.05}
.big .v.txt{font-size:21px}
.big .un{font-size:13.5px;color:var(--muted)}
.cat{display:inline-block;font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 10px}
.cat.c0{background:var(--c0-bg);color:var(--c0)}.cat.c1{background:var(--c1-bg);color:var(--c1)}.cat.c2{background:var(--c2-bg);color:var(--c2)}.cat.c3{background:var(--c3-bg);color:var(--c3)}
.ln{font-size:13px;margin:0}
.ln.mut{color:var(--muted)}
.wn{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:5px 8px}
.act{font-size:13px;background:var(--act-bg);border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:6px 9px}
:root[data-theme="dark"] .act{border-left-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .act{border-left-color:var(--gold)}}
.needs{font-size:13.5px;color:var(--c2);font-weight:700}
.na{font-size:13px;color:var(--muted);font-style:italic}
.ins{padding:10px 13px 0;display:flex;flex-direction:column;gap:9px}
.ins:empty{display:none}
.sc details.more{margin-top:10px;border-top:1px solid var(--line)}
.sc details.more>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:8px 13px;list-style:none}
.sc details.more>summary::-webkit-details-marker{display:none}
.sc details.more>summary::before{content:"+ "}
.sc details.more[open]>summary::before{content:"– "}
.more .mb{padding:0 13px 12px;display:flex;flex-direction:column;gap:9px}
.src{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.sc .pad-b{height:12px}

/* summary */
.sum{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sum h2{margin:0;font-size:17px;color:var(--navy)}
:root[data-theme="dark"] .sum h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum h2{color:var(--gold)}}
.sum pre{margin:0;white-space:pre-wrap;font-family:var(--f-ui);font-size:14px;line-height:1.5;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:12px;max-width:80ch}
.sum .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top"><div class="in pad">
  <div class="brand"><b>Cardiac Scores</b><span>Prof. Yasser Baghdady · risk scores from prevention to intervention</span></div>
  <label class="search"><input id="q" type="search" placeholder="Search scores, e.g. HAS-BLED" aria-label="Search scores" autocomplete="off"></label>
  <div class="tb">
    <button type="button" data-units="conv" aria-pressed="true" title="mg/dL, µmol shown as mg/dL">mg/dL</button>
    <button type="button" data-units="si" aria-pressed="false" title="mmol/L and µmol/L">SI</button>
    <button type="button" data-act="example">Example</button>
    <button type="button" data-act="new">New patient</button>
  </div>
</div></header>
<nav class="views" aria-label="View"><div class="in pad">
  <button type="button" data-view="patient" aria-pressed="false">Patient</button>
  <button type="button" data-view="scores" aria-pressed="true">Scores</button>
  <button type="button" data-view="summary" aria-pressed="false">Summary</button>
</div></nav>
<main class="wrap pad">
  <aside id="profile" aria-label="Patient profile"></aside>
  <section id="scorecol" aria-label="Scores">
    <div class="colhead">
      <div class="scen" id="scen" role="group" aria-label="Clinical scenario"></div>
      <div class="vt" role="group" aria-label="View"><button type="button" data-view="scores" aria-pressed="true">Scores</button><button type="button" data-view="summary" aria-pressed="false">Summary</button></div>
    </div>
    <div id="cards"></div>
    <p class="foot">Results support, and do not replace, clinical judgement. Nothing you enter leaves this device. Build 1a · 07 Nov 2026</p>
  </section>
  <section id="summary" aria-label="Summary"></section>

  function val(s, k) {                    // effective value: explicit entry, else auto rule, else default
    var f = F[k], v = s[k];
    if (f.type === 'num') { v = parseFloat(v); return isNaN(v) ? null : v; }
    if (f.type === 'bool') { if (v === true || v === false) return v; return f.auto ? !!f.auto(raw(s)) : false; }
    return v != null && v !== '' ? v : (f.autoDef ? f.autoDef(raw(s)) : (f.def || null));
  }
  function raw(s) { var o = {}; for (var k in F) if (F[k].type === 'num') { var n = parseFloat(s[k]); o[k] = isNaN(n) ? null : n; } else o[k] = s[k]; return o; }
  function isAuto(s, k) { var f = F[k]; return f.type === 'bool' && f.auto && s[k] !== true && s[k] !== false && !!f.auto(raw(s)); }
  function all(s) { var o = {}; for (var k in F) o[k] = val(s, k); return o; }

  function derive(p) {
    var d = {};
    d.egfr = (p.cr && p.age && p.sex) ? RS.egfr(p.cr, p.age, p.sex) : null;
    d.crcl = (p.sex) ? UT.crcl(p.cr, p.age, p.sex, p.wt) : null;
    d.bmi = RS.bmi(p.wt, p.ht);
    d.bsa = UT.bsa(p.wt, p.ht);
    d.nonhdl = (p.tc && p.hdl) ? p.tc - p.hdl : null;
    d.ldlF = UT.friedewald(p.tc, p.hdl, p.tg);
    d.ldlS = UT.sampson(p.tc, p.hdl, p.tg);
    d.map = UT.map(p.sbp, p.dbp);
    d.pp = (p.sbp && p.dbp) ? p.sbp - p.dbp : null;
    d.ascvd = !!(p.cad || p.cevd || p.pad || p.aaa);
    return d;
  }

    inputs: ['age', 'sex', 'sbp', 'tc', 'hdl', 'smoker', 'dm', 'dmAge', 'hba1c', 'cr', 'famhx'],

  /* ---------- field widgets ---------- */
  function field(k, o) {
    o = o || {}; var f = F[k], id = 'i' + (++nid) + '_' + k, cls = 'f' + (o.need ? ' need' : '');
    if (f.type === 'num') return '<div class="' + cls + '"><label for="' + id + '">' + esc(f.label) + '</label><div class="box"><input id="' + id + '" data-k="' + k + '" type="number" inputmode="decimal" step="any" value="' + esc(shown(k)) + '">' + (unitOf(k) ? '<span class="u">' + esc(unitOf(k)) + '</span>' : '') + '</div></div>';
    if (f.type === 'choice' && f.opts.length > 5) return '<div class="' + cls + ' wide"><label for="' + id + '">' + esc(f.label) + '</label><div class="box"><select id="' + id + '" data-sel="' + k + '">' + f.opts.map(function (op) {
      return '<option value="' + esc(op[0]) + '"' + (DEF.val(S, k) === op[0] || (!DEF.val(S, k) && op[0] === '') ? ' selected' : '') + '>' + esc(op[1]) + '</option>'; }).join('') + '</select></div></div>';
    if (f.type === 'choice') return '<div class="' + cls + '"><span class="lb">' + esc(f.label) + '</span><div class="seg" role="group" aria-label="' + esc(f.label) + '">' + f.opts.map(function (op) {
      return '<button type="button" data-ch="' + k + '" data-v="' + op[0] + '" aria-pressed="' + (DEF.val(S, k) === op[0]) + '">' + esc(op[1]) + '</button>'; }).join('') + '</div></div>';
    var on = DEF.val(S, k), au = DEF.isAuto(S, k);
    return '<button type="button" class="chip' + (au ? ' auto' : '') + '" data-b="' + k + '" aria-pressed="' + on + '"' + (au ? ' title="Ticked automatically from the profile; tap to override"' : '') + '>' + esc(f.label) + (au ? '<span class="tag">auto</span>' : '') + '</button>';
  }
  function fields(keys, needSet) {
    var nums = keys.filter(function (k) { return F[k].type !== 'bool'; }), bools = keys.filter(function (k) { return F[k].type === 'bool'; }), h = '';
    var ch = nums.filter(function (k) { return F[k].type === 'choice'; }), nn = nums.filter(function (k) { return F[k].type === 'num'; });
    ch.forEach(function (k) { h += field(k, { need: needSet && needSet[k] }); });
    if (nn.length) h += '<div class="grid">' + nn.map(function (k) { return field(k, { need: needSet && needSet[k] }); }).join('') + '</div>';
    if (bools.length) h += '<div class="chips">' + bools.map(function (k) { return field(k); }).join('') + '</div>';
    return h;
  }

  /* ---------- profile ---------- */
  var openGroups = load('open', { demo: 1, vit: 1, lip: 1, ren: 1, rf: 1, hx: 1, rx: 0, acs: 0 });
  function renderProfile() {
    var h = isExample ? '<div class="example"><span>Showing an <b>example patient</b>. Edit any value or start a new patient.</span><button type="button" class="btn ghost" data-act="new">New patient</button></div>' : '';
    DEF.GROUPS.forEach(function (g) {
      var keys = Object.keys(F).filter(function (k) { return F[k].g === g[0] && !F[k].local && (!F[k].show || F[k].show(S)); });
      var filled = keys.filter(function (k) { return F[k].type === 'bool' ? S[k] === true : S[k] != null && S[k] !== ''; }).length;
      h += '<details class="grp" data-g="' + g[0] + '"' + (openGroups[g[0]] ? ' open' : '') + '><summary><span>' + g[1] + '</span><span class="cnt">' + (filled ? filled + ' entered' : '') + '</span></summary><div class="body">' +
        fields(keys) + '<div class="derived" data-der="' + g[0] + '"></div></div></details>';
    });
    $('#profile').innerHTML = h;
  }
  function f0(x) { return String(Math.round(x)); }
  function chol(x) { return units === 'si' ? (x / 38.67).toFixed(2) + ' mmol/L' : f0(x) + ' mg/dL'; }
  function renderDerived(d) {
    var m = {
      demo: (d.bmi ? '<span class="pill">BMI ' + d.bmi.toFixed(1) + '</span><span class="pill">BSA ' + d.bsa.toFixed(2) + ' m²</span>' : ''),
      vit: d.map ? '<span class="pill">MAP ' + f0(d.map) + '</span><span class="pill">PP ' + f0(d.pp) + '</span>' : '',
      lip: (d.nonhdl != null ? '<span class="pill">Non-HDL ' + chol(d.nonhdl) + '</span>' : '') + (d.ldlS != null ? '<span class="pill">LDL calc ' + chol(d.ldlS) + '</span>' : d.ldlF != null ? '<span class="pill">LDL calc ' + chol(d.ldlF) + '</span>' : ''),
      ren: (d.egfr ? '<span class="pill">eGFR ' + f0(d.egfr) + ' · ' + RS.gStage(d.egfr) + '</span>' : '') + (d.crcl ? '<span class="pill">CrCl ' + f0(d.crcl) + ' mL/min</span>' : ''),
      hx: d.ascvd ? '<span class="pill">Established ASCVD</span>' : ''
    };
    $$('[data-der]').forEach(function (el) { el.innerHTML = m[el.getAttribute('data-der')] || ''; });
  }

  /* ---------- score cards ---------- */
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var STATUS = { ported: 'Ported from your clinic tool; matches it in automated tests. Official-calculator check pending.', new: 'New; hand-checked test cases. Official-calculator check pending.', verified: 'Verified against the official calculator.' };
  function visible() {
    var t = q.trim().toLowerCase();
    return DEF.SCORES.filter(function (s) {
      if (scen === 'fav' && favs.indexOf(s.id) < 0) return false;
      if (scen !== 'all' && scen !== 'fav' && s.scen.indexOf(scen) < 0) return false;
      if (t && (s.name + ' ' + s.blurb + ' ' + s.domain).toLowerCase().indexOf(t) < 0) return false;
      return true;
    });
  }
  function renderScores() {
    $('#scen').innerHTML = DEF.SCEN.map(function (c) { return '<button type="button" data-scen="' + c[0] + '" aria-pressed="' + (scen === c[0]) + '">' + c[1] + (c[0] === 'fav' ? ' (' + favs.length + ')' : '') + '</button>'; }).join('');
    var list = visible(), h = '', dom = null;
    if (!list.length) h = '<div class="empty">' + (scen === 'fav' ? 'No favourites yet. Tap the star on any score to add it here.' : 'No score matches “' + esc(q) + '”.') + '</div>';
    else {
      h = '';
      list.forEach(function (s) {
        if (s.domain !== dom) { if (dom !== null) h += '</div>'; dom = s.domain; h += '<h2 class="dom-h">' + esc(dom) + '</h2><div class="cards">'; }
        h += '<article class="sc" data-id="' + s.id + '"><header><div class="tt"><h3>' + esc(s.name) + '</h3></div><button type="button" class="fav" data-fav="' + s.id + '" aria-pressed="' + (favs.indexOf(s.id) > -1) + '" aria-label="Favourite ' + esc(s.name) + '">' + STAR + '</button></header>' +
          '<p class="blurb">' + esc(s.blurb) + '</p><div class="res" data-res="' + s.id + '"></div><div class="ins" data-ins="' + s.id + '"></div>' +
          (s.inputs.length || s.source ? '<details class="more"><summary>All inputs and source</summary><div class="mb" data-all="' + s.id + '"></div></details>' : '') + '</article>';
      });
      h += '</div>';
    }
    $('#cards').innerHTML = h;
    renderIns(); renderAll(); update();
  }
  function renderIns() {
    var R = DEF.compute(S).r;
    $$('[data-ins]').forEach(function (el) {
      var s = DEF.SCORES.filter(function (x) { return x.id === el.getAttribute('data-ins'); })[0], r = R[s.id];
      if (r.na) { el.innerHTML = ''; return; }
      var miss = (r.missing || []).filter(function (k) { return !F[k].local; }), need = {};
      miss.forEach(function (k) { need[k] = 1; });
      (s.local || []).forEach(function (k) { if (F[k].type === 'num' && r.missing && r.missing.indexOf(k) > -1) need[k] = 1; });
      el.innerHTML = fields(miss.concat(s.local || []), need);
    });
  }
  function renderAll() {
    $$('[data-all]').forEach(function (el) {
      var s = DEF.SCORES.filter(function (x) { return x.id === el.getAttribute('data-all'); })[0];
      el.innerHTML = (s.inputs.length ? fields(s.inputs.filter(function (k) { return !F[k].show || F[k].show(S); })) : '') +
        '<p class="src">' + esc(s.source) + '</p><p class="src"><span class="badge">' + esc(s.status === 'verified' && s.verifiedBy ? 'Verified against ' + s.verifiedBy + '.' : STATUS[s.status]) + '</span> Checked ' + s.checked + '.</p>';
    });
  }
  function fmt(r) {
    if (r.text) return String(r.value);
    var dp = r.dp != null ? r.dp : (r.unit === '%' ? 1 : (Math.abs(r.value) < 10 && r.value % 1 ? 1 : 0));
    return Number(r.value).toFixed(dp);
  }
  function resHTML(r) {
    if (r.error) return '<p class="wn">Could not calculate: ' + esc(r.error) + '</p>';
    if (r.na) return '<p class="na">' + esc(r.na) + '</p>';
    if (!r.ok && r.hint && !r.missing.length) return '<p class="na">' + esc(r.hint) + '</p>';
    if (!r.ok) return r.missing.length ? '<p class="needs">Needs ' + r.missing.map(function (k) { return esc(F[k].label); }).join(', ') + '</p>' : '';
    var h = '<div class="big"><span class="v' + (r.text ? ' txt' : '') + '">' + esc(fmt(r)) + '</span>' + (r.unit ? '<span class="un">' + esc(r.unit) + '</span>' : '') +
      (r.catLabel && r.cat != null ? '<span class="cat c' + r.cat + '">' + esc(r.catLabel) + '</span>' : '') + '</div>';
    r.lines.forEach(function (l) { h += '<p class="ln mut">' + esc(l) + '</p>'; });
    r.warn.forEach(function (w) { h += '<p class="wn">' + esc(w) + '</p>'; });
    if (r.action) h += '<p class="act">' + esc(r.action) + '</p>';
    return h;
  }
  function update() {
    var C = DEF.compute(S); last = C;
    renderDerived(C.d);
    $$('[data-res]').forEach(function (el) {
      var id = el.getAttribute('data-res'), r = C.r[id];
      el.innerHTML = resHTML(r);
      el.closest('.sc').setAttribute('data-cat', r.ok ? (r.cat == null ? 'x' : r.cat) : '');
    });
    if (view === 'summary') renderSummary();
  }

  /* ---------- summary ---------- */
  function summaryText() {
    var C = last || DEF.compute(S), p = C.p, d = C.d, L = [];
    var date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    L.push('Cardiac risk scores · ' + date);
    var pt = [];
    if (p.age) pt.push(p.age + ' y'); if (p.sex) pt.push(p.sex);
    if (p.sbp) pt.push('BP ' + p.sbp + (p.dbp ? '/' + p.dbp : '')); if (p.tc) pt.push('TC ' + chol(p.tc)); if (p.hdl) pt.push('HDL ' + chol(p.hdl));
    if (d.egfr) pt.push('eGFR ' + f0(d.egfr));
    var rf = ['smoker', 'dm', 'htn', 'famhx', 'cad', 'cevd', 'pad', 'hf'].filter(function (k) { return p[k]; }).map(function (k) { return F[k].label; });
    if (pt.length) L.push('Patient: ' + pt.join(', ') + (rf.length ? '; ' + rf.join(', ') : ''));
    L.push('');
    var list = scen === 'all' ? DEF.SCORES : visible(), n = 0;
    list.forEach(function (s) { var r = C.r[s.id]; if (r && r.ok && r.summary && !s.noSummary) { L.push('• ' + r.summary); n++; } });
    if (!n) L.push('No scores calculated yet.');
    L.push('', 'Scores support, and do not replace, clinical judgement.');
    return L.join('\n');
  }
  function renderSummary() {
    var t = summaryText();
    $('#summary').innerHTML = '<div class="colhead"><div class="note">' + (scen === 'all' ? 'All calculated scores' : 'Scores in “' + esc(DEF.SCEN.filter(function (c) { return c[0] === scen; })[0][1]) + '”') + '</div>' +
      '<div class="vt" role="group" aria-label="View"><button type="button" data-view="scores" aria-pressed="false">Scores</button><button type="button" data-view="summary" aria-pressed="true">Summary</button></div></div>' +
      '<div class="sum"><h2>Summary for the report</h2><pre id="sumtext">' + esc(t) + '</pre><div class="row"><button type="button" class="btn" data-act="copy">Copy summary</button><span class="note" id="copied" aria-live="polite"></span></div>' +
      '<p class="note">Paste into your echo, Holter or pre-op report. Choose a scenario first to copy only that set.</p></div>';
  }

  /* ---------- events ---------- */
  function setView(v) {
    view = v; document.body.setAttribute('data-view', v);
    $$('.views button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-view') === v); });
    $$('#scorecol .vt button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-view') === v); });
    if (v === 'summary') renderSummary();
    window.scrollTo(0, 0);
  }
  function refreshForms() { renderProfile(); renderIns(); renderAll(); update(); }
  function leaveExample() { if (isExample) { isExample = false; var ex = $('.example'); if (ex) ex.remove(); } }

  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (k) {
      var c = si(k), v = e.target.value;
      S[k] = v === '' ? '' : (c ? String(parseFloat(v) / c.f) : v);
      leaveExample();
      $$('input[data-k="' + k + '"]').forEach(function (el) { if (el !== e.target) el.value = shown(k); });
      var fd = F[k], n = parseFloat(S[k]), out = fd.min != null && !isNaN(n) && (n < fd.min || n > fd.max);
      e.target.closest('.f').classList.toggle('out', !!out);
      update();
    } else if (e.target.id === 'q') { q = e.target.value; renderScores(); }
  });
  document.addEventListener('change', function (e) {
    var sk = e.target.getAttribute && e.target.getAttribute('data-sel');
    if (sk) { S[sk] = e.target.value; leaveExample(); refreshForms(); return; }
    if (e.target.getAttribute && e.target.getAttribute('data-k')) { var a = document.activeElement; if (!a || !a.closest || !a.closest('.ins')) { renderIns(); } }
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.closest && e.target.closest('.ins') && e.target.getAttribute('data-k')) setTimeout(function () { var a = document.activeElement; if (!a || !a.closest || !a.closest('.ins')) renderIns(); }, 0);
  });
  document.addEventListener('toggle', function (e) {
    var g = e.target.getAttribute && e.target.getAttribute('data-g'); if (g) { openGroups[g] = e.target.open ? 1 : 0; store('open', openGroups); }
  }, true);
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k;
    if ((k = b.getAttribute('data-b'))) { S[k] = !DEF.val(S, k); leaveExample(); refreshForms(); return; }
    if ((k = b.getAttribute('data-ch'))) { S[k] = b.getAttribute('data-v'); leaveExample(); refreshForms(); return; }
    if ((k = b.getAttribute('data-fav'))) { var i = favs.indexOf(k); if (i > -1) favs.splice(i, 1); else favs.push(k); store('favs', favs); if (scen === 'fav') renderScores(); else { b.setAttribute('aria-pressed', i < 0); $('[data-scen="fav"]').textContent = 'Favourites (' + favs.length + ')'; } return; }
    if ((k = b.getAttribute('data-scen'))) { scen = k; renderScores(); return; }
    if ((k = b.getAttribute('data-view'))) { setView(k); return; }
    if ((k = b.getAttribute('data-units'))) { units = k; store('units', units); $$('[data-units]').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-units') === units); }); refreshForms(); return; }
    var act = b.getAttribute('data-act');
    if (act === 'new') { S = {}; isExample = false; refreshForms(); if (window.innerWidth <= 900) setView('patient'); var f = $('#profile input'); if (f) f.focus(); }
    else if (act === 'example') { S = {}; Object.keys(EXAMPLE).forEach(function (x) { S[x] = EXAMPLE[x]; }); isExample = true; refreshForms(); }
    else if (act === 'copy') {
      var t = summaryText(), msg = $('#copied');
      var sel = function () { var el = $('#sumtext'), r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Text selected: press Ctrl+C (or Copy) to finish.'; };
      try { navigator.clipboard.writeText(t).then(function () { msg.textContent = 'Copied.'; }, sel); } catch (er) { sel(); }
    }
  });

  /* ---------- boot ---------- */
  $$('[data-units]').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-units') === units); });
  renderProfile(); renderScores(); setView('scores');
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|claudeusercontent/.test(location.hostname)) {
    try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { }
  }
})();
</script>
</body></html>
